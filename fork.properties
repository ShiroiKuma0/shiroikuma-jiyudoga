# Fork (shiroikuma-jiyudoga) version identity.
# Read by android/app/build.gradle.kts, _scripts/build-fork.sh and _scripts/build-fork-deb.mjs,
# so the deb and the apk are always built as the same version.
#
# FORK_VERSION is the HIGHER of our two upstreams' versions:
#   FreeTubeApp/FreeTube                package.json version   0.25.2
#   MarmadileManteater/FreeTubeAndroid  release tag            0.25.1.1
# FreeTubeAndroid's fourth component is its packaging respin of the SAME FreeTube base
# (their first respin of 0.25.1) — it is not a FreeTube version component; their own
# package.json still reads 0.25.1. We adopt whichever is higher after merging either
# upstream, so our version describes what the build actually contains and an
# upstream-tracking updater (shiroikuma-kakutoku) sees no phantom update.
# FreeTube 0.25.2 (2026-08-11 hotfix) overtook FreeTubeAndroid's 0.25.1.1 respin, so the
# respin component drops here — 0.25.2 > 0.25.1.1 both for dpkg and for the versionCode
# formula (25020001 > 25011021), so this is a rise, not the phantom downgrade the respin
# component exists to prevent. The FreeTubeAndroid side stays identified by its own pin.
#
# package.json stays upstream's — never edit it for fork builds.
FORK_VERSION=0.25.2
#
# The full versionName is FORK_VERSION + one upstream-base pin PER UPSTREAM + the counter, each
# top-level group opened by a `+`, each pin's own date, time and sha dot-joined:
#   <FORK_VERSION>+<FT date>.<HH-MM>.g<FT sha>+<FTA date>.<HH-MM>.g<FTA sha>+<BUILD_NUMBER, 3 digits>
# The pins are identifiers, never ordering material: the in-app updater orders builds by
# FORK_VERSION and the counter alone (see versionNumberGt in helpers/android/utils.js).
# The pins are NOT stored here — all three build entry points compute them from git at build time
# (`git merge-base HEAD master` and `git merge-base HEAD android/development`, plus each of those
# commits' own committer date). They exist because BOTH upstreams are git-tracking: `master`
# mirrors FreeTube's *development tip*, and we merge FreeTubeAndroid's `development` branch rather
# than its tags — so FORK_VERSION alone never says how current either side is. The order is fixed
# (FreeTube first), each pin moves only when that upstream is synced, and a missing ref drops
# only its own pin.
# SHARED-HISTORY GUARD: FreeTubeAndroid's `development` merges FreeTube's own `development` into
# itself, so before we have merged their branch the newest commit we share with it is a FREETUBE
# commit. The android pin is emitted only when its merge-base is NOT an ancestor of `master`;
# otherwise it is dropped, because naming the wrong upstream is worse than naming none.
# That guard has been satisfied since `android/development` was merged on 2026-08-02
# (f749ac02a), so the pin IS emitted: the merge-base is their own tip `fea7a050`, which is not an
# ancestor of `master`. It only disappears again if we ever sit on shared history alone.
# FORK_VERSION keeps its fourth "respin" component even though the FreeTubeAndroid pin now
# identifies that side exactly: dropping it would regress 0.25.1.1 -> 0.25.1 (a phantom downgrade
# for kakutoku) and zero the versionCode respin digit. The respin orders; the pin identifies.
# See the global `git-versioning` skill.
# Our per-build counter, zero-padded to three digits in every version name and filename
# (global rule: artifact lists sort in build order). Bumped by _scripts/build-fork.sh after
# every successful build; reset to 1 on EVERY FORK_VERSION change. The upstream-base pins move
# independently of this counter — a sync that does not change FORK_VERSION moves that upstream's
# pin and leaves the counter running, which still sorts correctly (the dates precede the `+N`).
BUILD_NUMBER=37
